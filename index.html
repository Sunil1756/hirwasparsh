<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="Green Enlightenment" />

    <!-- Canonical & Search Indexing -->
    <link rel="canonical" href="https://green-enlightenment.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Official Brand Favicons & PWA Manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#064e3b" />

    <!-- Open Graph / Facebook / WhatsApp (1200x630 Optimized) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://green-enlightenment.com/" />
    <meta property="og:site_name" content="Green Enlightenment" />
    <meta property="og:title" content="Green Enlightenment – AI & Satellite Tree Intelligence" />
    <meta property="og:description" content="Plant trees with proof. Track 36-month canopy vigor with Sentinel-2 multi-spectral telemetry, and verify survival with AI." />
    <meta property="og:image" content="https://green-enlightenment.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://green-enlightenment.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Green Enlightenment - Verified Afforestation MRV Platform" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@green_enlighten" />
    <meta name="twitter:title" content="Green Enlightenment – AI & Satellite Tree Intelligence" />
    <meta name="twitter:description" content="Plant trees with proof. Track canopy vigor with Sentinel-2 multi-spectral telemetry, and verify survival with AI." />
    <meta name="twitter:image" content="https://green-enlightenment.com/og-image.jpg" />

    <!-- Schema.org JSON-LD Structured Data for Search Indexing -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Green Enlightenment",
      "url": "https://green-enlightenment.com",
      "logo": "https://green-enlightenment.com/icon-512.png",
      "image": "https://green-enlightenment.com/og-image.jpg",
      "description": "AI and satellite-powered agroforestry and ecological tree intelligence verification platform.",
      "sameAs": [
        "https://github.com/green-enlightenment",
        "https://www.linkedin.com/company/green-enlightenment",
        "https://twitter.com/green_enlighten"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-20-4911-3800",
        "contactType": "customer service",
        "email": "contact@green-enlightenment.com",
        "areaServed": "IN",
        "availableLanguage": ["English", "Hindi", "Marathi"]
      }
    }
    </script>

    <!-- Pre-render styles to prevent white flash -->
    <style>
      #app-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        gap: 16px;
      }
      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: preloader-spin 0.8s linear infinite;
      }
      .preloader-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f8fafc;
      }
      .preloader-sub {
        font-size: 12px;
        color: #94a3b8;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Semantic Crawler-Accessible Content (Replaced immediately by React upon hydration) -->
      <div id="app-preloader">
        <div class="preloader-spinner"></div>
        <div class="preloader-title">Green Enlightenment</div>
        <div class="preloader-sub">Smart Green Verification Platform • Loading Telemetry...</div>
        <noscript>
          <div style="max-width: 600px; padding: 20px; text-align: center; color: #cbd5e1; font-size: 14px;">
            <h1>Green Enlightenment</h1>
            <p>Plant with Proof. Grow with Trust.</p>
            <p>Cryptographically audited afforestation MRV, Copernicus Sentinel-2 satellite intelligence, and IPCC Tier-2 carbon modeling.</p>
            <nav style="margin-top: 15px;">
              <a href="/tree-map" style="color: #34d399; margin: 0 10px;">Tree Map</a>
              <a href="/methodology" style="color: #34d399; margin: 0 10px;">Scientific Methodology</a>
              <a href="/about" style="color: #34d399; margin: 0 10px;">About</a>
              <a href="/contact" style="color: #34d399; margin: 0 10px;">Contact</a>
            </nav>
          </div>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
