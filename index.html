<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Enlightenment – Plant, Track & Grow a Greener Future</title>
    <meta name="description" content="Green Enlightenment is an AI & Satellite-powered Agroforestry and Ecological Tree Intelligence platform.">
    <meta name="author" content="Green Enlightenment" />

    <!-- Official Brand Favicons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Green Enlightenment – AI & Satellite Tree Intelligence" />
    <meta property="og:description" content="Plant trees, track 36-month canopy vigor with Sentinel-2 multi-spectral telemetry, and verify growth with Gemini AI." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Green Enlightenment – AI & Satellite Tree Intelligence" />
    <meta name="twitter:description" content="Plant trees, track 36-month canopy vigor with Sentinel-2 multi-spectral telemetry, and verify growth with Gemini AI." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Inline pre-render styles to eliminate white-screen flash -->
    <style>
      #app-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        gap: 16px;
      }
      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: preloader-spin 0.8s linear infinite;
      }
      .preloader-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #e2e8f0;
      }
      .preloader-sub {
        font-size: 11px;
        color: #94a3b8;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="app-preloader">
        <div class="preloader-spinner"></div>
        <div class="preloader-title">Green Enlightenment</div>
        <div class="preloader-sub">Initializing verified telemetry & satellite modules...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
